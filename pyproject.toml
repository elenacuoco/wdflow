[project]
name = "wdflow"
version = "1.1.1"
authors = [
  { name="Elena Cuoco", email="elena.cuoco@unibo.it" },
]
dependencies = [
  'numpy',
  'scipy',
  'pandas>=2.0',
  'scikit-learn>=1.2',
  'matplotlib>=3.7',
  'pyarrow',
  'h5py',
]
description = "WDF (Wavelet Detection Filter): trigger-generation pipeline (`wdf.processes`/`wdf.observers`) and downstream trigger analysis (`wdf.analysis`: clustering, coincidence, GNN, ROC/FAP) in one package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# `wdf.processes`/`wdf.observers` (trigger generation) need p4TSA's compiled
# core, imported as `pytsa`. It is deliberately NOT listed here: p4TSA has no
# PyPI distribution (FrameL has no wheel), and the unrelated `pytsa` project on
# PyPI is a Python decorator library, so a declared dependency would either fail
# to resolve or resolve to the wrong package. Build it from
# https://github.com/elenacuoco/p4TSA -- see README.
# `wdf.analysis` (downstream analysis) needs none of this and works standalone
# on already-saved trigger files.
pipeline = ["coloredlogs"]
gnn = ["torch>=2.1", "torch_geometric>=2.5"]
data = ["gwpy>=3.0"]
dev = ["pytest>=7"]
tutorials = ["jupyter", "nbclient", "ipykernel"]
mock = ["pycbc"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "myst-nb>=1"]
# Everything except the compiled core, which cannot come from an index.
all = ["wdflow[pipeline,gnn,data,dev,tutorials,mock,docs]"]

[project.urls]
"Homepage" = "https://elenacuoco.github.io/wdflow/"
"Source" = "https://github.com/elenacuoco/wdflow"
"Documentation" = "https://wdflow.readthedocs.io"
"Issues" = "https://github.com/elenacuoco/wdflow/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# distribution name is "wdflow"; the importable package is `wdf` (Phase 1 was
# a minimal-diff port of the legacy `wdf` package -- see README) with the
# former `wdfLib` analysis layer now merged in as the `wdf.analysis`
# subpackage, so there is exactly one namespace to import from.
packages = ["wdf"]
