[project]
name = "wdflow"
version = "1.3.0"
authors = [
  { name="Elena Cuoco", email="elena.cuoco@unibo.it" },
]
dependencies = [
  'numpy',
  'scipy',
  'pandas>=2.0',
  'scikit-learn>=1.2',
  'matplotlib>=3.7',
  'pyarrow',
  'h5py',
]
description = "WDF (Wavelet Detection Filter): real-time trigger generation for transient signals, with the downstream analysis that turns triggers into candidate events"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["gravitational-waves", "wavelet", "transients", "time-series", "triggers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# `wdf.processes`/`wdf.observers` need p4TSA's compiled core, `py4tsa`;
# `wdf.analysis` needs none of it, so it is an extra rather than a dependency.
pipeline = ["py4tsa>=3.2", "coloredlogs"]
gnn = ["torch>=2.1", "torch_geometric>=2.5"]
data = ["gwpy>=3.0"]
dev = ["pytest>=7"]
tutorials = ["jupyter", "nbclient", "ipykernel"]
mock = ["pycbc"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "myst-nb>=1"]
all = ["wdflow[pipeline,gnn,data,dev,tutorials,mock,docs]"]

[project.urls]
"Homepage" = "https://elenacuoco.github.io/wdflow/"
"Source" = "https://github.com/elenacuoco/wdflow"
"Documentation" = "https://wdflow.readthedocs.io"
"Issues" = "https://github.com/elenacuoco/wdflow/issues"
"Changelog" = "https://github.com/elenacuoco/wdflow/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# distribution name is "wdflow"; the importable package is `wdf` (Phase 1 was
# a minimal-diff port of the legacy `wdf` package -- see README) with the
# former `wdfLib` analysis layer now merged in as the `wdf.analysis`
# subpackage, so there is exactly one namespace to import from.
packages = ["wdf"]
