name: tutorials

# Executes the notebooks: the docs render them from their committed outputs,
# so nothing else runs them. Weekly rather than per push: what breaks a
# notebook is usually a change elsewhere.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  run:
    name: Execute the tutorials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install wdflow
        run: pip install -e ".[pipeline,tutorials,mock]"

      # No --allow-errors, so a cell that raises fails the run; no --inplace,
      # so the committed outputs are left alone.
      - name: Execute every notebook
        env:
          MPLBACKEND: Agg
        run: jupyter execute --timeout=900 tutorials/*.ipynb
