name: CI

# Every pull request into master must pass this before it can be merged. The
# branch-protection rule that enforces it names the job below as a required
# status check -- see CONTRIBUTING.md.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # The analysis layer works on saved trigger files and needs nothing compiled,
  # so most of the suite runs in seconds on a plain pip install. Keeping it a
  # separate job means a contributor touching wdf.analysis gets an answer
  # without waiting for a C++ build.
  analysis:
    name: Analysis layer (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # test_golden_output, test_reconstruction and test_zero_phase_whitening
      # drive the real trigger generation and so need pytsa; test_gnn needs
      # torch_geometric and test_mock_dataset needs pycbc. The `pipeline` job
      # below covers the first three.
      - name: Run the tests that need no compiled core
        run: |
          pytest tests -v \
            --ignore=tests/test_golden_output.py \
            --ignore=tests/test_reconstruction.py \
            --ignore=tests/test_zero_phase_whitening.py \
            --ignore=tests/test_gnn.py \
            --ignore=tests/test_mock_dataset.py

  # The full suite, with p4TSA built from source. p4TSA has no PyPI
  # distribution (FrameL has no wheel) and the `pytsa` name on PyPI belongs to
  # an unrelated project, so it is built here from its own repository with the
  # dependency set its conda recipe declares.
  pipeline:
    name: Full suite (p4TSA built from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out p4TSA
        uses: actions/checkout@v5
        with:
          repository: elenacuoco/p4TSA
          path: p4TSA

      - name: Set up build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: latest
          environment-name: wdflow-ci
          init-shell: bash
          create-args: >-
            -c conda-forge
            python=3.11
            pip
            cxx-compiler
            cmake>=3.15
            make
            scikit-build-core>=0.10
            pybind11>=2.12
            numpy
            scipy
            gsl
            fftw
            framel
            libboost-headers
            cereal
            pytest

      - name: Build and install p4TSA
        shell: bash -el {0}
        working-directory: p4TSA
        run: pip install . --no-build-isolation -v

      - name: Install wdflow
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Import smoke test
        shell: bash -el {0}
        run: python -c "import pytsa, wdf; print(pytsa.__file__); print(wdf.__file__)"

      # test_gnn needs torch_geometric and test_mock_dataset needs pycbc;
      # both are heavy for a gate that already covers the pipeline end to end.
      - name: Run the full suite
        shell: bash -el {0}
        run: |
          pytest tests -v \
            --ignore=tests/test_gnn.py \
            --ignore=tests/test_mock_dataset.py

  docs:
    name: Docs build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The same two steps .readthedocs.yaml performs. autodoc imports every
      # module it documents, so the package and its runtime dependencies have
      # to be here: conf.py mocks only the compiled and optional imports, and
      # without the rest every autodoc directive fails and -W fails the build.
      - name: Install docs requirements
        run: |
          pip install -r docs/requirements.txt
          pip install -e .

      # -W: autodoc mocks the compiled and optional imports (see docs/conf.py),
      # and the tutorials are rendered from their committed outputs rather than
      # executed, so a warning here is a real defect rather than a missing
      # dependency.
      - name: Build the docs
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
